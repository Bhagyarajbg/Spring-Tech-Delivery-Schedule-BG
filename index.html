<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Delivery Schedule & Logistics Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Firebase Core & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .status-todo { border-left: 5px solid #3b82f6; background-color: #eff6ff; }
    .status-completed { border-left: 5px solid #10b981; background-color: #ecfdf5; opacity: 0.85; }
    .status-cancelled { border-left: 5px solid #ef4444; background-color: #fef2f2; opacity: 0.75; }
    .status-postponed { border-left: 5px solid #f59e0b; background-color: #fffbeb; }
    .drop-highlight { background-color: rgba(59, 130, 246, 0.15) !important; border: 2px dashed #3b82f6 !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Header Navigation Bar -->
  <header class="bg-slate-900 text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2 shadow-md shrink-0">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <i class="fa-solid fa-truck-fast text-blue-400"></i> Delivery Schedule
      </h1>
      <!-- Live Sync Status Badge -->
      <div id="sync-status" class="px-2.5 py-1 bg-green-500/20 text-green-300 border border-green-500/40 rounded-full text-xs font-semibold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        <span id="sync-status-text">Live Sync: spt-delivery-plan</span>
      </div>
    </div>

    <!-- Navigation & Action Controls -->
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
        <button id="btn-prev" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition"><i class="fa-solid fa-chevron-left"></i></button>
        <button id="btn-today" class="px-3 py-1 font-medium text-sm text-slate-200 hover:bg-slate-700 rounded transition">Today</button>
        <button id="btn-next" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <span id="current-date-range" class="text-sm font-semibold text-slate-300 min-w-[140px] text-center"></span>

      <!-- View Selector -->
      <select id="view-select" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
        <option value="month">Month View</option>
        <option value="week">Week View</option>
        <option value="4day">4-Day View</option>
        <option value="3day">3-Day View</option>
        <option value="day" selected>Day View</option>
      </select>

      <div class="h-5 w-px bg-slate-700 mx-1"></div>

      <!-- Management & Backup Buttons -->
      <button id="btn-add-driver" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium rounded-lg text-slate-200 flex items-center gap-1 transition">
        <i class="fa-solid fa-user-plus text-blue-400"></i> + Driver
      </button>
      <button id="btn-add-type" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium rounded-lg text-slate-200 flex items-center gap-1 transition">
        <i class="fa-solid fa-tags text-purple-400"></i> + Type
      </button>
      <button id="btn-export-csv" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow flex items-center gap-1.5 transition">
        <i class="fa-solid fa-file-excel"></i> Export CSV
      </button>
      <button id="btn-share" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg shadow flex items-center gap-1.5 transition">
        <i class="fa-solid fa-share-nodes"></i> Share Link
      </button>
      <button id="btn-new-task" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg shadow flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus"></i> New Task
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main id="calendar-container" class="flex-1 overflow-x-auto overflow-y-hidden p-3 relative">
    <div id="calendar-grid" class="h-full flex gap-3 min-w-full"></div>
  </main>

  <!-- Edit / Add Modal -->
  <div id="task-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 flex flex-col gap-4 border border-slate-200 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800">Add Delivery Task</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="task-form" class="flex flex-col gap-3">
        <input type="hidden" id="task-id" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Title / Headline *</label>
          <input type="text" id="form-title" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., Deliver Furniture to Villa 12" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Scheduled Date *</label>
            <input type="date" id="form-date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Category / Type</label>
            <select id="form-category" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Assigned Driver</label>
            <select id="form-driver" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
            <select id="form-status" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Public Note / Delivery Address</label>
          <textarea id="form-message" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Address or special customer instructions..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Private Specifications & Details</label>
          <textarea id="form-details" rows="3" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-y" placeholder="Internal notes, phone numbers, specs..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Attachment (File Name / URL)</label>
          <input type="text" id="form-attachment" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., Invoice_9082.pdf" />
        </div>
        <div class="flex justify-end gap-2 border-t pt-3 mt-2">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 border rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-500 shadow">Save Delivery</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Read-Only Task Details Modal -->
  <div id="view-details-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 flex flex-col gap-4 border border-slate-200">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span id="view-task-category" class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800"></span>
          <h3 id="view-task-title" class="text-lg font-bold text-slate-800 mt-1"></h3>
        </div>
        <button id="btn-close-view-modal" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-2 text-sm text-slate-700">
        <p><strong class="text-slate-900">Date:</strong> <span id="view-task-date"></span></p>
        <p><strong class="text-slate-900">Driver:</strong> <span id="view-task-driver"></span></p>
        <p><strong class="text-slate-900">Status:</strong> <span id="view-task-status"></span></p>
        <div class="border-t pt-2">
          <strong class="text-slate-900 block mb-1">Public Note:</strong>
          <p id="view-task-message" class="text-slate-600 bg-slate-50 p-2 rounded text-xs border"></p>
        </div>
        <div class="border-t pt-2">
          <strong class="text-slate-900 block mb-1">Private Details:</strong>
          <p id="view-task-details" class="text-slate-600 bg-slate-50 p-2 rounded text-xs border whitespace-pre-wrap"></p>
        </div>
        <div id="view-attachment-container" class="border-t pt-2 hidden">
          <strong class="text-slate-900 block mb-1">Attachment:</strong>
          <a id="view-task-attachment" href="#" target="_blank" class="text-blue-600 hover:underline text-xs flex items-center gap-1"><i class="fa-solid fa-paperclip"></i> <span></span></a>
        </div>
      </div>
      <div class="flex justify-end border-t pt-3">
        <button id="btn-edit-from-view" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-500 shadow flex items-center gap-1.5"><i class="fa-solid fa-pen"></i> Edit Task</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Application Engine -->
  <script>
    // --- 1. FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyC7Al_aEhN8EFb8HOpq--K1VesoMtKmzcc",
      authDomain: "spt-delivery-plan.firebaseapp.com",
      projectId: "spt-delivery-plan",
      storageBucket: "spt-delivery-plan.firebasestorage.app",
      messagingSenderId: "167679281314",
      appId: "1:167679281314:web:4f7e82a030bbf177442ffb",
      measurementId: "G-8JBXQLTWVP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Default Fallback Initial Lists
    let drivers = ["Shahzad", "Sobus", "Ahmed", "Shoaib", "Nasir", "Bilal", "Osman", "Hamad Ali", "Awais", "Outside Vehicle", "Cust. Collection", "Courier"];
    let categories = ["Delivery", "Installation", "Collection", "Site Visit", "Maintenance"];
    let statuses = ["To Do", "Completed", "Cancelled", "Postponed"];
    let tasks = [];

    let currentDate = new Date();
    let currentView = "day";
    let activeFilters = {};

    // --- 2. CLOUD REAL-TIME SYNC ---
    function initCloudSync() {
      // Sync Tasks
      db.collection("deliveries").onSnapshot((snapshot) => {
        tasks = [];
        snapshot.forEach((doc) => {
          tasks.push({ id: doc.id, ...doc.data() });
        });
        renderCalendar();
      }, (error) => {
        console.error("Firestore sync error:", error);
      });

      // Sync Metadata (Drivers, Categories)
      db.collection("settings").doc("meta").onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (data.drivers) drivers = data.drivers;
          if (data.categories) categories = data.categories;
        } else {
          db.collection("settings").doc("meta").set({ drivers, categories, statuses });
        }
        populateSelectOptions();
        renderCalendar();
      });
    }

    function saveMetaToCloud() {
      db.collection("settings").doc("meta").set({ drivers, categories, statuses });
    }

    // --- 3. DOM ELEMENT REFERENCES ---
    const calendarGrid = document.getElementById("calendar-grid");
    const currentDateRange = document.getElementById("current-date-range");
    const viewSelect = document.getElementById("view-select");
    const taskModal = document.getElementById("task-modal");
    const viewDetailsModal = document.getElementById("view-details-modal");
    const taskForm = document.getElementById("task-form");

    // --- 4. DATE HELPER FUNCTIONS ---
    function formatDateISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getDaysForView() {
      const days = [];
      const start = new Date(currentDate);

      if (currentView === "day") {
        days.push(new Date(start));
      } else if (currentView === "3day") {
        for (let i = 0; i < 3; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          days.push(d);
        }
      } else if (currentView === "4day") {
        for (let i = 0; i < 4; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          days.push(d);
        }
      } else if (currentView === "week") {
        const dayOfWeek = start.getDay();
        const diff = start.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1); // Monday start
        const monday = new Date(start.setDate(diff));
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          days.push(d);
        }
      } else if (currentView === "month") {
        const year = start.getFullYear();
        const month = start.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        for (let d = 1; d <= lastDay.getDate(); d++) {
          days.push(new Date(year, month, d));
        }
      }
      return days;
    }

    // --- 5. RENDER CALENDAR VIEWS ---
    function renderCalendar() {
      calendarGrid.innerHTML = "";
      const days = getDaysForView();

      if (days.length > 0) {
        if (currentView === "month") {
          currentDateRange.textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        } else {
          currentDateRange.textContent = `${days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${days[days.length - 1].toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
        }
      }

      days.forEach((dayDate) => {
        const dateStr = formatDateISO(dayDate);
        const dayCol = document.createElement("div");
        dayCol.className = `flex-1 min-w-[280px] bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full overflow-hidden`;

        // Column Header with Day-Specific Filters
        const header = document.createElement("div");
        header.className = "bg-slate-800 text-white p-2.5 border-b border-slate-700 flex flex-col gap-1.5 shrink-0";
        header.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">${dayDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
            <button onclick="openAddTaskModal('${dateStr}')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2 py-0.5 rounded flex items-center gap-1"><i class="fa-solid fa-plus"></i> Add</button>
          </div>
          <div class="grid grid-cols-2 gap-1 text-xs">
            <select onchange="setFilter('${dateStr}', 'driver', this.value)" class="bg-slate-700 text-slate-200 rounded px-1.5 py-0.5 text-xs outline-none border border-slate-600">
              <option value="">All Drivers</option>
              ${drivers.map(d => `<option value="${d}" ${activeFilters[dateStr]?.driver === d ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
            <select onchange="setFilter('${dateStr}', 'status', this.value)" class="bg-slate-700 text-slate-200 rounded px-1.5 py-0.5 text-xs outline-none border border-slate-600">
              <option value="">All Statuses</option>
              ${statuses.map(s => `<option value="${s}" ${activeFilters[dateStr]?.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
        `;
        dayCol.appendChild(header);

        // Task Cards Droppable Body
        const cardList = document.createElement("div");
        cardList.className = "flex-1 overflow-y-auto p-2 space-y-2 no-scrollbar";
        cardList.dataset.date = dateStr;

        // Drag & Drop Listeners
        cardList.addEventListener("dragover", (e) => { e.preventDefault(); cardList.classList.add("drop-highlight"); });
        cardList.addEventListener("dragleave", () => { cardList.classList.remove("drop-highlight"); });
        cardList.addEventListener("drop", (e) => {
          e.preventDefault();
          cardList.classList.remove("drop-highlight");
          const taskId = e.dataTransfer.getData("text/plain");
          if (taskId) {
            db.collection("deliveries").doc(taskId).update({ date: dateStr });
          }
        });

        // Filter Tasks for Day
        let dayTasks = tasks.filter(t => t.date === dateStr);
        if (activeFilters[dateStr]?.driver) {
          dayTasks = dayTasks.filter(t => t.driver === activeFilters[dateStr].driver);
        }
        if (activeFilters[dateStr]?.status) {
          dayTasks = dayTasks.filter(t => t.status === activeFilters[dateStr].status);
        }

        dayTasks.forEach(task => {
          cardList.appendChild(renderTaskCard(task));
        });

        dayCol.appendChild(cardList);
        calendarGrid.appendChild(dayCol);
      });
    }

    // --- 6. RENDER TASK CARDS ---
    function renderTaskCard(task) {
      const card = document.createElement("div");
      const statusClass = `status-${(task.status || 'todo').toLowerCase().replace(/\s+/g, '')}`;
      
      card.className = `p-3 rounded-lg shadow-sm border border-slate-200 cursor-grab ${statusClass} flex flex-col gap-1.5 transition hover:shadow-md relative`;
      card.draggable = true;
      card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", task.id); });

      const isCompact = (currentView === "month" || currentView === "week");

      if (isCompact) {
        card.innerHTML = `
          <div class="flex items-center justify-between gap-1" onclick="openViewDetailsModal('${task.id}')">
            <span class="font-bold text-xs truncate text-slate-800">${task.title}</span>
            <div class="flex items-center gap-1">
              ${task.attachment ? '<i class="fa-solid fa-paperclip text-slate-400 text-xs"></i>' : ''}
              <span class="w-2 h-2 rounded-full ${task.details ? 'bg-emerald-500' : 'bg-red-400'}"></span>
            </div>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="flex justify-between items-start gap-1">
            <h4 class="font-bold text-xs text-slate-900 leading-tight cursor-pointer hover:text-blue-600" onclick="openViewDetailsModal('${task.id}')">${task.title}</h4>
            <div class="flex items-center gap-1.5">
              ${task.attachment ? `<i class="fa-solid fa-paperclip text-slate-400 text-xs cursor-pointer" onclick="openViewDetailsModal('${task.id}')"></i>` : ''}
              <span class="w-2 h-2 rounded-full ${task.details ? 'bg-emerald-500' : 'bg-red-400'}" title="${task.details ? 'Has Details' : 'No Details'}"></span>
              <button onclick="openEditTaskModal('${task.id}')" class="text-slate-400 hover:text-blue-600 text-xs px-0.5"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-red-600 text-xs px-0.5"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          ${task.message ? `<p class="text-xs text-slate-600 line-clamp-2">${task.message}</p>` : ''}
          <div class="flex items-center justify-between border-t border-slate-200/60 pt-1.5 mt-0.5 text-xs">
            <span class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded font-medium">${task.driver || 'Unassigned'}</span>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${task.status === 'Completed' ? 'bg-emerald-200 text-emerald-800' : task.status === 'Cancelled' ? 'bg-red-200 text-red-800' : 'bg-blue-200 text-blue-800'}">${task.status || 'To Do'}</span>
          </div>
        `;
      }
      return card;
    }

    // --- 7. MODAL ACTIONS & EVENT LISTENERS ---
    function populateSelectOptions() {
      const catSelect = document.getElementById("form-category");
      const drvSelect = document.getElementById("form-driver");
      const stsSelect = document.getElementById("form-status");

      catSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      drvSelect.innerHTML = drivers.map(d => `<option value="${d}">${d}</option>`).join('');
      stsSelect.innerHTML = statuses.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function openAddTaskModal(defaultDate = null) {
      document.getElementById("task-id").value = "";
      taskForm.reset();
      if (defaultDate) document.getElementById("form-date").value = defaultDate;
      else document.getElementById("form-date").value = formatDateISO(new Date());
      document.getElementById("modal-title").textContent = "Add Delivery Task";
      taskModal.classList.remove("hidden");
    }

    function openEditTaskModal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById("task-id").value = task.id;
      document.getElementById("form-title").value = task.title || "";
      document.getElementById("form-date").value = task.date || "";
      document.getElementById("form-category").value = task.category || categories[0];
      document.getElementById("form-driver").value = task.driver || drivers[0];
      document.getElementById("form-status").value = task.status || statuses[0];
      document.getElementById("form-message").value = task.message || "";
      document.getElementById("form-details").value = task.details || "";
      document.getElementById("form-attachment").value = task.attachment || "";

      document.getElementById("modal-title").textContent = "Edit Delivery Task";
      viewDetailsModal.classList.add("hidden");
      taskModal.classList.remove("hidden");
    }

    function openViewDetailsModal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById("view-task-title").textContent = task.title;
      document.getElementById("view-task-category").textContent = task.category || 'Delivery';
      document.getElementById("view-task-date").textContent = task.date;
      document.getElementById("view-task-driver").textContent = task.driver || 'Unassigned';
      document.getElementById("view-task-status").textContent = task.status || 'To Do';
      document.getElementById("view-task-message").textContent = task.message || 'No public notes';
      document.getElementById("view-task-details").textContent = task.details || 'No private details';

      const attachContainer = document.getElementById("view-attachment-container");
      const attachLink = document.getElementById("view-task-attachment");
      if (task.attachment) {
        attachContainer.classList.remove("hidden");
        attachLink.href = task.attachment.startsWith("http") ? task.attachment : "#";
        attachLink.querySelector("span").textContent = task.attachment;
      } else {
        attachContainer.classList.add("hidden");
      }

      document.getElementById("btn-edit-from-view").onclick = () => openEditTaskModal(task.id);
      viewDetailsModal.classList.remove("hidden");
    }

    function deleteTask(taskId) {
      if (confirm("Are you sure you want to delete this task?")) {
        db.collection("deliveries").doc(taskId).delete();
      }
    }

    function setFilter(dateStr, key, value) {
      if (!activeFilters[dateStr]) activeFilters[dateStr] = {};
      activeFilters[dateStr][key] = value;
      renderCalendar();
    }

    // Task Form Submit
    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("task-id").value;
      const data = {
        title: document.getElementById("form-title").value,
        date: document.getElementById("form-date").value,
        category: document.getElementById("form-category").value,
        driver: document.getElementById("form-driver").value,
        status: document.getElementById("form-status").value,
        message: document.getElementById("form-message").value,
        details: document.getElementById("form-details").value,
        attachment: document.getElementById("form-attachment").value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (id) {
        db.collection("deliveries").doc(id).update(data);
      } else {
        db.collection("deliveries").add(data);
      }
      taskModal.classList.add("hidden");
    });

    // --- 8. EXPORT TO CSV FEATURE ---
    document.getElementById("btn-export-csv").addEventListener("click", () => {
      if (tasks.length === 0) {
        alert("No tasks available to export!");
        return;
      }
      let csv = "\uFEFFTask ID,Scheduled Date,Title,Driver,Category,Status,Message Note,Private Details,Attachment\n";
      tasks.forEach(t => {
        const escapeCSV = (str) => `"${(str || '').toString().replace(/"/g, '""')}"`;
        csv += `${escapeCSV(t.id)},${escapeCSV(t.date)},${escapeCSV(t.title)},${escapeCSV(t.driver)},${escapeCSV(t.category)},${escapeCSV(t.status)},${escapeCSV(t.message)},${escapeCSV(t.details)},${escapeCSV(t.attachment)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Delivery_Schedule_Export_${formatDateISO(new Date())}.csv`;
      link.click();
    });

    // Share Link Button
    document.getElementById("btn-share").addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Live collaboration link copied to clipboard!");
    });

    // Global Management Buttons
    document.getElementById("btn-add-driver").addEventListener("click", () => {
      const name = prompt("Enter new driver name:");
      if (name && !drivers.includes(name)) {
        drivers.push(name);
        saveMetaToCloud();
      }
    });

    document.getElementById("btn-add-type").addEventListener("click", () => {
      const name = prompt("Enter new category/type:");
      if (name && !categories.includes(name)) {
        categories.push(name);
        saveMetaToCloud();
      }
    });

    // Navigation Controls
    document.getElementById("btn-prev").addEventListener("click", () => {
      if (currentView === "month") currentDate.setMonth(currentDate.getMonth() - 1);
      else if (currentView === "week") currentDate.setDate(currentDate.getDate() - 7);
      else if (currentView === "4day") currentDate.setDate(currentDate.getDate() - 4);
      else if (currentView === "3day") currentDate.setDate(currentDate.getDate() - 3);
      else currentDate.setDate(currentDate.getDate() - 1);
      renderCalendar();
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      if (currentView === "month") currentDate.setMonth(currentDate.getMonth() + 1);
      else if (currentView === "week") currentDate.setDate(currentDate.getDate() + 7);
      else if (currentView === "4day") currentDate.setDate(currentDate.getDate() + 4);
      else if (currentView === "3day") currentDate.setDate(currentDate.getDate() + 3);
      else currentDate.setDate(currentDate.getDate() + 1);
      renderCalendar();
    });

    document.getElementById("btn-today").addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar();
    });

    viewSelect.addEventListener("change", (e) => {
      currentView = e.target.value;
      renderCalendar();
    });

    document.getElementById("btn-new-task").addEventListener("click", () => openAddTaskModal());
    document.getElementById("btn-close-modal").addEventListener("click", () => taskModal.classList.add("hidden"));
    document.getElementById("btn-cancel-modal").addEventListener("click", () => taskModal.classList.add("hidden"));
    document.getElementById("btn-close-view-modal").addEventListener("click", () => viewDetailsModal.classList.add("hidden"));

    // --- 9. INITIALIZE APPLICATION ---
    populateSelectOptions();
    initCloudSync();
  </script>
</body>
</html>
